# Minimal, log-free nginx for the DF-13.3 "paste" service.
# Serves EXACTLY one obscure path; everything else 404s. Keeps no logs.
worker_processes 1;
error_log /dev/null crit;
pid /tmp/nginx.pid;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;
    default_type text/plain;
    types { }                      # no mime.types dependency; everything is text/plain

    server {
        listen 80 default_server;
        server_name raw.pastebox.lab;
        root /srv/paste;
        autoindex off;

        # The only valid resource — the ID is the secret (security by obscurity).
        location = /p/a7f3c9e2b1d84f60 {
            try_files /stage2.ps1 =404;
        }

        # Anything else — including the index and any guessed path — is a 404.
        location / { return 404; }
    }
}
